name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned to commit SHAs rather than tags: a tag is a movable
# pointer, so a retargeted tag is a supply-chain risk.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 12

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # hosts/pi 是唯一自带 lockfile 的宿主包：根 tsconfig 会编译它的 test/，
      # 但它依赖的 @earendil-works/pi-ai 只装在这里，根 pnpm install 看不到。
      # 漏掉这一步，CI 的类型检查必然报 "Cannot find module @earendil-works/pi-ai"。
      - name: Install host dependencies
        working-directory: hosts/pi
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      # 四套用例都注入假的 fetch 与假 agent，不需要模型也不需要网络。
      - name: Tests
        run: pnpm test
