# dsh 模型 provider 配置（实测可用形态，留档参考）。
#
# 权威源：~/nix-config/modules/nixos/nas-dsh.nix（Nix 生成 patch，NAS 用
# `sudo nixos-rebuild switch --flake github:yxlimo/nix-config#nas` 部署）。
# 本文件只是同内容的可读副本，改动请改 nix 模块。
#
# 关键点：providers 必须挂在 llm-pi-ai 条目下。pi-ai 适配器读的是自己条目的
# config.providers，写在核心 llm 条目下会得到
# "NO_ADAPTER: no adapter registered for provider <id>"。
#
# buddy router 在 NAS 192.168.50.4:6450，OpenAI 兼容端点用根路径 /v1；
# 模型 id 大小写敏感；router 不校验 api key。

- id: llm-pi-ai
  config:
    providers:
      buddy:
        displayName: Buddy Router
        apiKeyEnv: DEEPSEEK_API_KEY
        api: openai-completions
        baseURL: http://192.168.50.4:6450/v1
        models:
          - id: dsh-manager
            contextWindow: 1000000
            maxTokens: 128000

- id: agent-default-model
  config:
    provider: buddy
    model: dsh-manager
