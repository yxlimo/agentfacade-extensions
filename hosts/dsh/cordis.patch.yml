# dsh bundle 层：一行插件，注册 agentfacade 这条 provider 路由。
#
# `name` 必须是装进 profile 的 node_modules 之后的**完整包名**（pnpm 按真实名字建链接，
# 写裸名会 ERR_MODULE_NOT_FOUND，宿主启动即崩）。值要加引号：YAML 里以字母开头的普通
# 标量没问题，但将来若改成 @scope/name，会像参考实现那样被当成指示符而解析失败。
- insert:
    - id: llm-agentfacade
      name: "dsh-agentfacade"
      config: {}
